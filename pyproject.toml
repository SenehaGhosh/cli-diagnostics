[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-diagnostics"
version = "0.1.0"
description = "A distributable command-line tool that inspects machine state and event logs."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
sysdiag = "cli_diagnostics.main:main"

[project.optional-dependencies]
dev = ["pytest"]